; PLAY PRESET: the mod's defaults (Android or PC, picked automatically) with the steadier image
; (SteadyImage=on): each frame blended with the previous one, the characters' own movement followed
; so they stay sharp, SMAA Medium. Laces, hair, thin lines and railings shimmer less; on the tablet it
; costs about 2 ms of GPU work a frame. F7 switches the blending off and on (PC keyboard).
; Copy over MetaphorCPU.ini in the game folder; to go back, copy build\MetaphorCPU.ini over it again.
[General]
Enabled=1

[Quality]
SteadyImage=on

[Telemetry]
Enabled=0
