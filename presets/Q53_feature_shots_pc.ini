; SHOTS Q53 (PC, ~3 min): the pictures of VisualComparison.md. One image of the game per change, in the
; order of the results table, all with the Android settings on PC.
; Before starting, in the game folder (Steam\steamapps\common\METAPHOR):
;   * an ASI loader: winmm.dll (Ultimate ASI Loader, it comes with MetaphorFix);
;   * MetaphorCPU.asi from build\, and this file as MetaphorCPU.ini.
; In the game: frame-rate limit 30, Ambient occlusion off, V-sync off, Antialiasing SMAA, render scale 100%.
;   1. Load a save in the Sunlumeo street and wait 1 minute (the far meshes are simplified in the background).
;   2. In daylight, stand still with people both near and far in view, a long way down the street. Press F10, then touch
;      nothing for 30 s: it switches through the 20 variants and saves an image of each.
;   3. Go to a second place with people and a long view and press F10 again the same way.
;   4. Quit the game. The images are in "MetaphorCPU_compare folder" in the game folder, about 120 MB each time.
; To go back, copy build\MetaphorCPU.ini over this file in the game folder.
[General]
Enabled=1
Profile=android

[ABTest]
Enabled=1
SwitchSec=36000
Compare=features

[GpuProbe]
CompareShots=13
