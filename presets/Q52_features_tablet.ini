; TEST Q52 (tablet, about 25 minutes, unplugged): what every change of the mod saves or costs, in one session.
; After a warm-up of 4 minutes the session switches every 30 s between 20 variants (a round takes 10 minutes):
;   the mod's Android defaults (three times per round, to follow the tablet warming up);
;   each change taken back in turn: shadow culling, CPU fixes, far meshes, far shadows every 2nd frame, shadows up
;   to 100 m, SMAA High, outlines within 40 m, no rim light, glare off, far animation, NPC stand-ins from 60 m;
;   the steadier image built up: characters, whole image, 8 neighbours, all limbs' motion, limbs within 20 m, the
;   whole switch with SMAA Medium.
; The job semaphore replacement only takes effect at startup, so it is on in all of them.
;
; Before starting:
;   * put MetaphorCPU.asi and this file (as MetaphorCPU.ini) in the game folder;
;   * MetaphorFix.ini: [LOD] Distance = 10; camera shake off, as you play;
;   * in the game: 30 FPS limit, ambient occlusion off, V-sync off, SMAA; render resolution as you play;
;   * unplug the USB cable, Balanced mode.
; Then:
;   1. Start the game and load a save in Sunlumeo's big street, within 4 minutes of starting.
;   2. Camera along the street with many NPCs on screen. Put the controller down; don't move for 25 minutes.
;   3. Quit the game. The log is also copied to Download/GameNative/MetaphorCPU.live.log.
; The picture changes a little every 30 s: that is the test.
[General]
Enabled=1
LogCopy=/storage/emulated/0/Download/GameNative/MetaphorCPU.live.log

[GpuProbe]
Timing=1

[ABTest]
Enabled=1
SwitchSec=30
StartAfterSec=240
Compare=features
