; ==========================================================================================
;  MetaphorCPU - performance mod for Metaphor: ReFantazio (Android emulation and PC)
; ==========================================================================================
; How to read this file:
;   * Lines starting with ; are comments. Never put a comment on the same line as a value.
;   * 1 = on, 0 = off. auto = the default for the device: the Android profile under Wine
;     (Winlator / GameNative), the PC profile on Windows.
;   * A key left out keeps its default. What every change does and what it looks like:
;     RESULTS.md in the project folder.

[General]
; 1 = the mod on. 0 = the game unchanged but still measured (for A/B tests);
; with ProfileWhenDisabled=0 as well, the mod does nothing at all.
Enabled=1
ProfileWhenDisabled=1
; auto (recommended), android or pc. The PC profile keeps the CPU fixes off.
Profile=auto
; Log detail: 0 = errors, 1 = info, 2 = verbose. The previous log is kept as MetaphorCPU.prev.log.
LogLevel=1
; A second copy of the log, written as it goes: a Windows path, or under Wine a Linux path such as
; /storage/emulated/0/Download/MetaphorCPU.log (where adb can read it during a run). Empty = none.
LogCopy=

; ==========================================================================================
;  PICTURE AND GPU  [Quality]  (needs [ShadowCull] Enabled=1, which installs the hooks)
; ==========================================================================================
[Quality]

; ---- Steadier image: costs GPU time ------------------------------------------------------
; One switch for a calmer picture: laces, hair, thin lines, railings and far edges shimmer
; and break up less while the camera or the characters move. It blends each frame with the
; previous one, follows the characters' own movement so they stay sharp, and sets SMAA to
; Medium (the blending already smooths what High adds).
; Trade-off, tablet: about 2 ms more GPU work a frame; battery power and frame rate unchanged
; in a busy street, but less headroom for 30 FPS in heavier places.
; off (default, Android and PC) / on
SteadyImage=off
; The parts, one by one: auto follows SteadyImage, a value of their own wins.
; Characters blended with the previous frame: off / on (40%) / a percentage up to 95.
; F7 switches the blending off and on while playing.
TemporalStabilise=auto
; The same for everything else (world, sky, props): off / on (50%) / a percentage.
TemporalStabiliseWorld=auto
; The world is checked against its 4 direct neighbours (looks the same) or 8.
TemporalStabiliseWorldTaps=4
; The characters' own movement, so walking characters stay sharp: off / on.
; Works only together with TemporalStabilise.
CharacterMotionVectors=auto
; ... for characters within this many metres (0 = all).
MotionVectorDistance=40
; ... their limbs' movement only within this many metres when it is crowded.
; auto = 20 on Android (not noticeable), 0 = every character's (PC).
MotionVectorSkinDistance=auto
; ... "crowded" = more than this many characters around (a fight has fewer).
MotionVectorSkinCrowd=12

; ---- Anti-aliasing and screen effects ----------------------------------------------------
; SMAA: ultra (the game's), high, medium, off (jagged).
; auto = high, or medium with SteadyImage.
Smaa=auto
; Glare around bright lights (runs only in the capital; a faint glow at night).
; auto = off on Android, on on PC. 1 = on, 0 = off.
Glare=auto
; Volumetric fog: the capital's haze (tints the distant air by day). 1 = on, 0 = off.
VolumetricFog=1
; The painterly background (brush-stroke wobble, darkened edges): part of the art style.
Painterly=1

; ---- Character lines and shimmer ---------------------------------------------------------
; Character ink outlines only within this many metres; all = no outlines; on / off = all drawn.
; auto = 40 on Android (hardly noticeable), all drawn on PC.
OutlineDistance=auto
; 1 = what a character carries (bags, weapons) loses its outline with it; 0 = only the character.
OutlineCarried=1
; The bright rim line on characters and toon props: on / off / a distance in metres.
; auto = off on Android (less shimmer), on on PC.
RimLight=auto
; Outline lines over a character's own body: on / off / a distance. Off removes good lines too.
InnerOutlines=on
; Outlines pushed back by this % of their distance (0 = as the game; 0.5 clears streaks in hair).
OutlineDepthOffset=0
; Hatching strokes in toon shadows: on / a number of mip levels softer / flat (no strokes).
Hatching=on
; The thin line meshes on clothes: none (as the game), redraw, thick, redraw2, conservative, hide.
; They close the dashes but do not stop the shimmer (SteadyImage does).
LineFix=none
LineShaders=dfeac58cd1cc3a84
; LineFix only for characters within this many metres (0 = all; keep 0).
LineDistance=0
; Character / world textures this many mip levels softer (0 to 2, steps of 0.25).
; No gain found: softer textures, no GPU time saved.
CharacterTextureBias=0
WorldTextureBias=0

; ---- Far away: NPCs, meshes, animation ---------------------------------------------------
; NPCs farther than this from the hero use the game's simple stand-in models (the game: 100 m).
; auto = 60 on Android (large saving in crowds), the game's on PC. 0 = the game's (or
; MetaphorFix's [LOD] Distance: keep that at 10).
CharacterLodDistance=auto
; Moves that distance in (down to AdaptiveLodMin) while the frame rate is low and back out when
; it recovers, a metre or two at a time. auto = on (Android), off (PC).
AdaptiveLod=auto
AdaptiveLodMin=40
; In by AdaptiveLodInSpeed m/s while the last AdaptiveLodDownSec s averaged below AdaptiveLodDownFps
; (a few under your cap).
AdaptiveLodDownFps=25
AdaptiveLodDownSec=3
AdaptiveLodInSpeed=2
; Out by AdaptiveLodOutSpeed m/s while the last AdaptiveLodUpSec s held AdaptiveLodUpFps
; (just under your frame cap: 29 for 30 FPS).
AdaptiveLodUpFps=29
AdaptiveLodUpSec=10
AdaptiveLodOutSpeed=1
; "Far" for the options below: farther than this many metres from the camera.
FarDistance=50
; Far characters animated every Nth frame (1 = every frame). auto = 2 on Android, 1 on PC.
FarCharacterAnimation=auto
; Simpler far meshes made by the mod: off / safe (seams kept) / seams.
; auto = seams on Android (looks the same), off on PC (no gain there).
FarMeshes=auto
; Largest shape error on screen in pixels; a simpler mesh keeps at least this % of its triangles.
FarMeshPixels=0.5
FarMeshMinPercent=10
; Shadow casters' simpler meshes picked by shadow-map texels; 0 = by the screen.
FarMeshShadowTexels=1
; seams: simplified across texture seams only from this many metres (0 = everywhere).
FarMeshSeamsFrom=150

; ---- Shadows -----------------------------------------------------------------------------
; Shadows end this many metres from the camera (the game: 200); near shadows get sharper too.
; auto = 100 on Android, the game's on PC. 0 = the game's.
ShadowDistance=auto
; The far shadow cascade redrawn every Nth frame (1 = every frame). auto = 2 (Android and PC).
FarShadowRefresh=auto

; ---- Tested, no gain: leave as they are --------------------------------------------------
; Far objects' textures this many mip levels smaller (flags look worse).
FarTextureMipBias=0
; Objects smaller than this many pixels (at 720p) / casters under this many shadow texels skipped.
TinyObjectPixels=0
TinyCasterTexels=0
; Anisotropic filtering capped at this level (0 = the game's).
MaxAnisotropy=0

; ---- Measurement only: these change the game a lot ---------------------------------------
; 1 = as the game. 0 hides the characters / their shadows / the far shadows / all shadows.
Characters=1
CharacterShadows=1
FarShadows=1
Shadows=1
; Every texture this many mip levels smaller (blurry, menus too).
TextureMipBias=0
; 0 = far characters not drawn at all (they pop in and out).
FarCharacters=1
; World objects beyond this many metres hidden (0 = off).
FarWorldHidden=0
; 1 = log what the scene draws every window (extra hooks: not for power tests).
Report=0

; ==========================================================================================
;  SHADOW CULLING  (no visible change; on for Android and PC)
; ==========================================================================================
[ShadowCull]
; Skips shadow casters that cannot touch a shadow cascade: the same picture (verified on PC),
; far less shadow work. Every [Quality] option needs it.
Enabled=1
; Extra border around each cascade, in % of its width.
MarginPercent=1
; Animated casters (characters) tested with their current skeleton plus this margin in %
; (verified safe even at 0). -1 = never skip them.
AnimatedMarginPercent=10
; Casters whose shadow cannot reach the visible view: 0 = off, 1 = measure, 2 = skip (unverified).
ViewCull=0
ViewCullDepthMarginPercent=25
; PC check: draw everything and count the pixels the skipped draws would touch (must be 0).
Verify=0

; ==========================================================================================
;  CPU FIXES  (Android profile only; the PC profile ignores these sections)
;  In Winlator / GameNative tick every core in Processor Affinity.
; ==========================================================================================
[JobSync]
; The job semaphore replaced: it wakes one worker per job and never blocks the poster.
; Set at start-up; needs 4+ cores.
FastSemaphore=1
; Polls before a waiting worker sleeps. auto = 256 with 4+ cores, else 32.
SpinCount=auto

[Timer]
; One timer resolution instead of a change around every short sleep of the engine.
FixTimerChurn=1
TimerPeriodMs=1
; Sleeps exact to the microsecond. No effect measured.
PreciseUSleep=0

[Yield]
; Wait loops spin on Sleep(0), which burns a whole core under Wine. After YieldSpinUs of
; spinning each Sleep(0) sleeps YieldSleepUs; a gap over YieldWindowUs starts afresh.
AdaptiveYield=1
; 0 = Sleep(0), 1 = SwitchToThread.
YieldMode=1
YieldSpinUs=50
YieldSleepUs=100
YieldWindowUs=30

[SpinLock]
; The engine's spinlock (1500 spins without PAUSE) replaced: spin with PAUSE, yield, then wait.
ReplaceSpinLock=1
SpinIterations=32
YieldIterations=1
WaitTimeoutMs=1

[CriticalSection]
; Spin count of the game's critical sections (the game: 1500). -1 = keep.
SpinCount=-1

[Affinity]
; The game's thread pinning: 0 = passed on, 1 = ignored (the system places threads),
; 2 = kept inside AllowedCores.
Mode=1
; Hex core masks (0 = all / leave alone). MainThreadCores=auto: the fastest cores, found at start.
AllowedCores=0
MainThreadCores=0
WorkerCores=0
DetectFastCores=0
; Threads kept on the fast cores, by name prefix, comma separated (e.g. dxvk-cs). Empty = none.
FastThreadNames=

[Priority]
; Thread priority -2 to 2; 99 = leave alone. MainThread only applies with AdaptiveYield=1.
; JobWorkers has no effect: the game's thread creation is inside its protected code.
MainThread=99
JobWorkers=99

[Jobs]
; EXPERIMENTAL: job workers per pool (the game: 5). 0 = keep; 1 to 32.
WorkerPool0=0
WorkerPool1=0

; ==========================================================================================
;  PC ONLY  (ignored on Android). The same CPU fixes, opt-in: no gain measured on PC.
; ==========================================================================================
[PC]
; A 1 ms timer resolution / the spinlock with PAUSE / the job semaphore that wakes one worker.
FixTimerChurn=0
ReplaceSpinLock=0
FastSemaphore=0

; ==========================================================================================
;  FRAME LIMITER
; ==========================================================================================
[FrameLimiter]
; The mod's own limiter (even pacing, no busy waiting). 0 = off: use the game's cap.
; When on, set the game's limit above it (60 or unlimited).
Fps=0
; Spin margin before each deadline in microseconds; -1 = learnt automatically.
SpinMarginUs=-1

; ==========================================================================================
;  TESTING AND DIAGNOSTICS  (leave as they are for playing; the test presets set them)
; ==========================================================================================
[Profiler]
; CPU use per thread and frame times in MetaphorCPU.log every IntervalSec seconds.
Enabled=1
IntervalSec=10
TopThreads=16
; Frame rate and frame-time spread (hooks the game's Present).
FrameStats=1

[Telemetry]
; Android: battery power, temperatures, GPU and CPU clocks from /sys and /proc, into the log only.
Enabled=0
SampleMs=1000

[ABTest]
; One session switches between variants every SwitchSec seconds; stand still meanwhile.
; tools\summarize_variants.py compares them. Compare picks the variants:
;   all            shadow culling and the CPU fixes off / as set
;   overall        the game as-is / this INI / this INI with SteadyImage on
;   features       this INI, each change taken back in turn, the steadier image part by part
;   cpu            the timer and spinlock fixes off / as set
;   shadowcull, animcull, preciseusleep: that one fix off / as set
;   quality, charmodes, far, bubble, gpu, shadowrefresh, effects, farmesh, fmshadow, outlines,
;   look, lines, stabilise, motion, smaa, savings, occlusion, knockout: one area's variants
Enabled=0
SwitchSec=60
Compare=all
; A cycle holds its first variant this many seconds before it starts (loading, warming up).
StartAfterSec=0

[GpuProbe]
; Each of these costs a little CPU: not for power tests.
; Draw calls per render pass; which shadow passes draw the same objects.
Enabled=0
; GPU time per render pass.
Timing=0
; Render-pass audit: what a tiled GPU loads and stores per frame.
Passes=0
; PC: F10 saves one frame's render passes as images, with their shaders.
Capture=0
; Seconds after start for one automatic capture or set of compare shots (0 = by key only).
CaptureAfterSec=0
; PC: F10 (F11 with Capture=1) saves the final image once per variant of a set:
;    1 post-processing    2 far meshes        3 far mesh shadows   4 outline distance
;    5 painterly          6 rim light         7 thin lines         8 broken lines
;    9 shadows, hatching 10 knock-out        11 line meshes       12 world textures
CompareShots=0
; With Capture=1: pass images at full size (not 960 px) / the screen's middle after every draw.
CaptureFullSize=0
CaptureDrawSteps=0
; PC: F8 saves the textures of the characters within DumpDistance metres (DDS files).
DumpCharacterTextures=0
DumpDistance=5
; The characters' motion shown instead of the image: green = still, yellow / cyan = moving
; right / left, magenta = rejected. Needs CharacterMotionVectors.
MotionVectorView=0
; The compute shaders the game dispatches, listed every window (timed with Timing=1).
ComputeCensus=0
; PC: F9 records 300 frames of which meshes make the triangles beyond 50 m.
MeshCensus=0
; PC: every scene object inside an occlusion query: how much of the scene is hidden.
OcclusionCensus=0
; PC: GPU time per pixel shader (not on Android: it splits the tiled GPU's passes).
ShaderTiming=0
; Up to 6 pixel shader hashes (hex, comma separated) for Compare=knockout; without that cycle the
; first one is left out all session.
KnockoutShaders=
; Where captures and compare shots go: a folder in the game folder, or a full path.
OutputFolder=MetaphorCPU_compare folder

[WaitProfile]
; Where the main thread waits each frame, and from which game calls.
Enabled=0

[Sampler]
; Samples the code the main thread and the busiest threads run, Hz times a second (0 = off).
Hz=0
Threads=3
