; PLAY PRESET: the mod's defaults (Android or PC, picked automatically), with the game's ink look off,
; to see whether the picture shimmers less:
;   - the characters' ink outlines, and those of what they carry (bags, weapons, hats), at every
;     distance. The floating texts and speech bubbles keep theirs: the same shaders draw them, so
;     leaving those out would remove the bubbles themselves.
;   - the painterly pass: the brush-stroke wobble of the background and its darkened edges (the ink
;     lines of buildings and props). The background is copied plainly instead.
; The painterly shader is known from Sunlumeo; if another area still shows the wobble, the log's
; "painterly wobble bound ... times" says 0 there and that area uses another shader (tell me).
; Copy over MetaphorCPU.ini in the game folder; to go back, copy build\MetaphorCPU.ini over it again.
[General]
Enabled=1

[Quality]
OutlineDistance=all
OutlineCarried=1
Painterly=0

[Telemetry]
Enabled=0
