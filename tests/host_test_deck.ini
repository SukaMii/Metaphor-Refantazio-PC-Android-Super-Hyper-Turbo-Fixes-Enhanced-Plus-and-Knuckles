[General]
; the Steam Deck profile: every CPU-side fix off, as on PC
Profile=steamdeck
Enabled=1
LogLevel=2

[Profiler]
Enabled=1
IntervalSec=1
TopThreads=8

[Priority]
MainThread=99

[Affinity]
DetectFastCores=1
MainThreadCores=auto

[Yield]
; a tablet value: must be ignored on the PC profile
YieldSpinUs=50
