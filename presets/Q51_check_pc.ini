; CHECK Q51 (PC, ~5 min): MetaphorCPU in the game (Steam, with Denuvo).
; It checks what the code alone cannot show:
;   * the game runs with the mod's patches (Denuvo leaves them alone);
;   * the shadow culling still never touches the picture: nothing is skipped, every shadow draw it
;     WOULD skip is drawn inside an occlusion query, and the log counts the pixels (must be 0);
;   * the SMAA shaders are recognised, and the steadier image works.
; Before starting, in the game folder (Steam\steamapps\common\METAPHOR):
;   * an ASI loader: winmm.dll (Ultimate ASI Loader, it comes with MetaphorFix);
;   * MetaphorCPU.asi from build\, and this file as MetaphorCPU.ini.
; In the game: frame-rate limit 30. Load a save in the Sunlumeo street (NPCs around):
;   1. ~1 minute standing still;
;   2. ~2 minutes walking around and turning the camera; press F7 a few times while walking (the
;      steadier image off and on: thin lines and hair should shimmer more when it is off);
;   3. quit the game and send MetaphorCPU.log (in the game folder).
; If the game crashes or closes at start, send the log too: it shows how far the mod got.
