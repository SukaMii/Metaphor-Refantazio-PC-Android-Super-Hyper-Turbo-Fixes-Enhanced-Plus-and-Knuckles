; PLAY PRESET: the mod's defaults (Android or PC, picked automatically), set for less shimmer while keeping
; the game's black outlines up close:
;   - the characters' black outlines only within 20 m (farther, they are thin, broken lines);
;   - no toon rim light (the bright dashed line just inside the outlines, on characters and toon props such
;     as barrels and carts): it is 1-2 px wide and broken even on the hero, so
;     RimLight=20 would keep it on the character you look at most;
;   - the painterly pass off: no brush-stroke wobble, no dark edge speckle on buildings (set Painterly=1
;     to keep it);
;   - SMAA High instead of Medium: it also smooths diagonal edges (on PC you can use ultra, the game's own).
; Copy over MetaphorCPU.ini in the game folder; to go back, copy build\MetaphorCPU.ini over it again.
[General]
Enabled=1

[Quality]
OutlineDistance=20
OutlineCarried=1
RimLight=off
Painterly=0
Smaa=high

[Telemetry]
Enabled=0
