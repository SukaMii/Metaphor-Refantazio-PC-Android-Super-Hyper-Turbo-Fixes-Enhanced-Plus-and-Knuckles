; PLAY PRESET: the mod's defaults (Android or PC, picked automatically) with the characters' ink lines drawn
; whole: each line mesh (lapels, stitches, frog closures, hair strands) is drawn 4 more times shifted by a third
; of a pixel, so lines thinner than a pixel stay continuous instead of breaking into dots, on every character.
; Copy over MetaphorCPU.ini in the game folder; to go back, copy build\MetaphorCPU.ini over it again.
[General]
Enabled=1

[Quality]
LineFix=redraw
LineDistance=0

[Telemetry]
Enabled=0
