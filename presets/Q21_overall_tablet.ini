; POWER TEST Q21 (tablet, ~15 min): the whole mod against the game as-is, for one overall number,
; and what the steadier image (SteadyImage) adds on top. One session switches every 60 s between:
;   1. the game as-is: shadow culling, the CPU fixes and every picture option off;
;   2. the mod's Android defaults (NPC stand-ins held at 60 m while the test runs);
;   3. the same with SteadyImage on (the stabilisation, the characters' motion, SMAA Medium).
; The job semaphore replacement only takes effect at startup, so it is on in all three.
;
; Before starting:
;   * copy this file over MetaphorCPU.ini in the game folder (to go back: build\MetaphorCPU.ini);
;   * MetaphorFix.ini: [LOD] Distance = 10 (so the game-as-is part has the game's NPC distance);
;     camera shake off, as you play;
;   * in the game: 30 FPS limit, ambient occlusion off.
; Then:
;   1. Sunlumeo, the big street: camera along the street, many NPCs on screen.
;   2. Put the controller down; don't move for ~15 minutes (in the first minutes the far meshes
;      are being simplified: keep standing, the analysis leaves out the start).
;   3. Quit the game and send MetaphorCPU.log.
; The log should have lines starting "Overall cycle:" and "Far meshes:".
[General]
Enabled=1
; a copy of the log on the tablet's shared storage, for adb to read during the run
LogCopy=/storage/emulated/0/Download/GameNative/MetaphorCPU.live.log

[GpuProbe]
Timing=1

[ABTest]
Enabled=1
SwitchSec=60
Compare=overall
